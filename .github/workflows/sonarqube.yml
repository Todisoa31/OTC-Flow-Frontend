name: Scan Code with sonarqube

on:
  # push:
  #  branches:
  #    - dev
  workflow_dispatch:

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  notification:
    name: Envoyer une notification sur Discord
    runs-on: ubuntu-latest
    needs: build 
    if:  success()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4    
      - name: Send Discord Notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          JSON_PAYLOAD=$(jq -n --arg repo "${{ github.repository }}" \
                               --arg branch "${{ github.ref_name }}" \
                               --arg url "${{ secrets.SONAR_HOST_URL }}/dashboard?id=OTC-Flow-Frontend" \
                               '{"content": "🚀 **SonarQube Scan - \($repo)**\n📌 **Branche**: `\($branch)`\n✅ **Déscription**: Le scan SonarQube du projet **OTC-Flow-Frontend** a été effectué. Veuillez consulter et corriger les problèmes qui vous ont été assignés en suivant le lien en dessous\n🔗 **Voir les résultats**: [SonarQube](\($url))"}')
          curl -X POST -H "Content-Type: application/json" -d "$JSON_PAYLOAD" $DISCORD_WEBHOOK_URL